<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PurrTok Kombat</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; 
            outline: none;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c1b, #201335);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 10px;
        }

        .header {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #b19ffb;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .balance-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .balance-icon {
            font-size: 28px;
            animation: pulse 2s infinite;
        }

        .balance-text {
            font-size: 32px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .energy-bar-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .energy-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            box-shadow: 0 0 10px #ff416c;
            transition: width 0.1s ease;
        }

        .energy-text {
            font-size: 11px;
            color: #ff9a9e;
            margin-top: 5px;
            font-weight: 600;
            text-align: right;
        }

        .clicker-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
        }

        .circle-button {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #4a2574 0%, #1a0b36 100%);
            border: 6px solid #9d6fff;
            box-shadow: 0 0 35px rgba(157, 111, 255, 0.4), inset 0 0 25px rgba(157, 111, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.05s ease;
            touch-action: manipulation;
        }

        .circle-button:active {
            transform: scale(0.94);
            border-color: #c2a3ff;
            box-shadow: 0 0 50px rgba(194, 163, 255, 0.7), inset 0 0 35px rgba(194, 163, 255, 0.5);
        }

        .paw-inner-icon {
            font-size: 90px;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(157, 111, 255, 0.6));
        }

        .floating-text {
            position: absolute;
            font-size: 28px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 100;
        }

        .content-panel {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 12, 27, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 10px;
            height: 250px;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #ff4b2b;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .roulette-btn {
            background: linear-gradient(90deg, #8a2be2, #4a00e0);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
            margin-top: 10px;
            transition: transform 0.2s;
            width: 100%;
        }

        .navbar {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 8px;
            backdrop-filter: blur(15px);
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.4);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #8e8a9f;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 12px;
            transition: all 0.2s ease;
            flex: 1;
        }

        .nav-item.active {
            color: #ffffff;
            background: rgba(127, 86, 218, 0.25);
            box-shadow: inset 0 0 10px rgba(127, 86, 218, 0.2);
        }

        .nav-icon {
            font-size: 20px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120px) scale(0.8); opacity: 0; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">PurrTok Kombat</div>
        <div class="balance-container">
            <span class="balance-icon">🐾</span>
            <span id="balance" class="balance-text">0</span>
            <span style="color: #b19ffb; font-weight: bold;">$PURR</span>
        </div>
        <div class="energy-bar-container">
            <div id="energyBar" class="energy-bar"></div>
        </div>
        <div id="energyText" class="energy-text">Ярость кота: 100/100</div>
    </div>

    <div id="tab-game" class="clicker-container">
        <div class="circle-button" id="clickButton">
            <span class="paw-inner-icon">🐾</span>
        </div>
    </div>

    <div id="tab-mini-games" class="content-panel">
        <div class="panel-title">🎰 Кошачья Рулетка</div>
        <p style="font-size: 13px; color: #a5a1b8;">Стоимость прокрута: 50 $PURR.</p>
        <button class="roulette-btn" id="spinBtn">Крутить колесо! 🎡</button>
        <div class="roulette-result" id="rouletteResult"></div>
    </div>

    <div id="tab-upgrades" class="content-panel">
        <div class="panel-title">🛒 Магазин Апгрейдов</div>
        <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div style="font-weight: bold; font-size: 14px;">😼 Острые когти</div>
                <div style="font-size: 11px; color: #8e8a9f;">+20 монет за тап.</div>
            </div>
            <button style="background: #7f56da; border: none; color: white; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 12px;">150 $PURR</button>
        </div>
    </div>

    <div id="tab-wallet" class="content-panel">
        <div class="panel-title">🏆 Кошачий Статус</div>
        <button id="finishBtn" style="background: linear-gradient(90deg, #ff416c, #ff4b2b); border: none; color: white; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px; width: 100%;">Завершить Тыгыдык и Выйти 🚪</button>
    </div>

    <div class="navbar">
        <button id="btn-game" class="nav-item active" onclick="switchTab('game')"> <span class="nav-icon">🎮</span> <span>Тыгыдык</span> </button>
        <button id="btn-mini-games" class="nav-item" onclick="switchTab('mini-games')"> <span class="nav-icon">🎰</span> <span>Игры</span> </button>
        <button id="btn-upgrades" class="nav-item" onclick="switchTab('upgrades')"> <span class="nav-icon">🛒</span> <span>Апгрейды</span> </button>
        <button id="btn-wallet" class="nav-item" onclick="switchTab('wallet')"> <span class="nav-icon">🏆</span> <span>Статус</span> </button>
    </div>

    <audio id="audioClick" src="https://zvukipro.com" preload="auto"></audio>
    <audio id="audioCrash" src="https://zvukipro.com" preload="auto"></audio>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                }
                let balance = 0;
                let energy = 100;
                const maxEnergy = 100;
                const balanceEl = document.getElementById('balance');
                const energyBarEl = document.getElementById('energyBar');
                const energyTextEl = document.getElementById('energyText');
                const clickButton = document.getElementById('clickButton');
                const audioClick = document.getElementById('audioClick');
                const audioCrash = document.getElementById('audioCrash');
                document.body.addEventListener('click', () => {
                audioClick.play().then(() => { audioClick.pause(); }).catch(e => console.log(e));
                audioCrash.play().then(() => { audioCrash.pause(); }).catch(e => console.log(e));
                }, { once: true });
                clickButton.addEventListener('click', (e) => {
                if (energy <= 0) {
                alert('Кот устал!');
                return;
                }
                balance += 10;
                energy -= 1;
                balanceEl.textContent = balance;
                updateEnergyBar();
                audioClick.currentTime = 0;
                audioClick.play().catch(err => console.log("Звук ждет клика"));
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
                }
                createFloatingText(e);
                });
                function updateEnergyBar() {
                const percentage = (energy / maxEnergy) * 100;
                energyBarEl.style.width = percentage + '%';
                energyTextEl.textContent = Ярость кота: ${energy}/${maxEnergy};
                }
                function createFloatingText(e) {
                const floating = document.createElement('div');
                floating.className = 'floating-text';
                floating.textContent = '+10';
                let x, y;
                if (e.changedTouches && e.changedTouches.length > 0) {
                x = e.changedTouches[0].clientX;
                y = e.changedTouches[0].clientY;
                } else {
                x = e.clientX || window.innerWidth / 2;
                y = e.clientY || window.innerHeight / 2;
                }
                floating.style.left = (x - 20) + 'px';
                floating.style.top = (y - 30) + 'px';
                document.body.appendChild(floating);
                setTimeout(() => { floating.remove(); }, 600);
                }
                function switchTab(tabId) {
                document.getElementById('tab-game').style.display = 'none';
                document.getElementById('tab-mini-games').style.display = 'none';
                document.getElementById('tab-upgrades').style.display = 'none';
                document.getElementById('tab-wallet').style.display = 'none';
                document.getElementById('btn-game').classList.remove('active');
                document.getElementById('btn-mini-games').classList.remove('active');
                document.getElementById('btn-upgrades').classList.remove('active');
                document.getElementById('btn-wallet').classList.remove('active');
                if (tabId === 'game') {
                document.getElementById('tab-game').style.display = 'flex';
                } else {
                document.getElementById('tab-' + tabId).style.display = 'flex';
                }
                document.getElementById('btn-' + tabId).classList.add('active');
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
                }
                }
                const spinBtn = document.getElementById('spinBtn');
                const rouletteResult = document.getElementById('rouletteResult');
                spinBtn.addEventListener('click', () => {
                if (balance < 50) {
                rouletteResult.style.color = '#ff416c';
                rouletteResult.textContent = 'Недостаточно монет!';
                return;
                }
                balance -= 50;
                balanceEl.textContent = balance;
                rouletteResult.textContent = 'Колесо крутится... 🌀';
                setTimeout(() => {
                const outcomes = [
                { text: '🎰 ДЖЕКПОТ! +250 $PURR', win: 250, sound: true },
                { text: '😼 Украл колбасу: +80 $PURR', win: 80, sound: false },
                { text: '⚰️ Мимо! +0 $PURR', win: 0, sound: false },
                { text: '🙀 Получил тапком: -30 $PURR', win: -30, sound: false }
                ];
                const result = outcomes[Math.floor(Math.random() * outcomes.length)];
                balance += result.win;
                if (balance < 0) balance = 0;
                balanceEl.textContent = balance;
                rouletteResult.textContent = result.text;
                if (result.sound) {
                audioCrash.currentTime = 0;
                audioCrash.play().catch(e => console.log(e));
                }
                }, 1000);
                });
                document.getElementById('finishBtn').addEventListener('click', () => {
                if (window.Telegram && window.Telegram.WebApp) {
                const dataToSend = JSON.stringify({ score: balance, event: "finish_game" });
                window.Telegram.WebApp.sendData(dataToSend);
                window.Telegram.WebApp.close();
                } else {
                alert(Вы вышли из игры. Счет: ${balance});
                }
                });
                setInterval(() => {
                if (energy < maxEnergy) {
                energy++;
                updateEnergyBar();
                }
                }, 4000);
