<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PurrTok Kombat</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; 
            outline: none;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c1b, #201335);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 10px;
        }

        .header {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #b19ffb;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .balance-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .balance-icon {
            font-size: 28px;
            animation: pulse 2s infinite;
        }

        .balance-text {
            font-size: 32px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .energy-bar-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .energy-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            box-shadow: 0 0 10px #ff416c;
            transition: width 0.1s ease;
        }

        .energy-text {
            font-size: 11px;
            color: #ff9a9e;
            margin-top: 5px;
            font-weight: 600;
            text-align: right;
        }

        .clicker-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            width: 100%;
        }

        .circle-button {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, #4a2574 0%, #1a0b36 100%);
            border: 6px solid #9d6fff;
            box-shadow: 0 0 35px rgba(157, 111, 255, 0.4), inset 0 0 25px rgba(157, 111, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.05s ease;
            touch-action: manipulation;
        }

        .circle-button:active {
            transform: scale(0.94);
            border-color: #c2a3ff;
            box-shadow: 0 0 50px rgba(194, 163, 255, 0.7), inset 0 0 35px rgba(194, 163, 255, 0.5);
        }

        .paw-inner-icon {
            font-size: 90px;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(157, 111, 255, 0.6));
        }

        .floating-text {
            position: absolute;
            font-size: 28px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 100;
        }

        .content-panel {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 12, 27, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px;
            display: none; 
            flex-direction: column;
            gap: 10px;
            height: 250px;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #ff4b2b;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .roulette-btn, .exit-btn {
            background: linear-gradient(90deg, #8a2be2, #4a00e0);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
            margin-top: 10px;
            transition: transform 0.2s;
            width: 100%;
        }

        .exit-btn {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        .navbar {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 8px;
            backdrop-filter: blur(15px);
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.4);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #8e8a9f;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 12px;
            transition: all 0.2s ease;
            flex: 1;
        }

        .nav-item.active {
            color: #ffffff;
            background: rgba(127, 86, 218, 0.25);
            box-shadow: inset 0 0 10px rgba(127, 86, 218, 0.2);
        }

        .nav-icon {
            font-size: 20px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120px) scale(0.8); opacity: 0; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">PurrTok Kombat</div>
        <div class="balance-container">
            <span class="balance-icon">🐾</span>
            <span id="balance" class="balance-text">0</span>
            <span style="color: #b19ffb; font-weight: bold;">$PURR</span>
        </div>
        <div class="energy-bar-container">
            <div id="energyBar" class="energy-bar"></div>
        </div>
        <div id="energyText" class="energy-text">Ярость кота: 100/100</div>
    </div>

    <!-- ВКЛАДКА 0: ГЛАВНЫЙ ЭКРАН (ТЫГЫДЫК) -->
    <div id="tab-game" class="clicker-container">
        <div class="circle-button" id="clickButton">
            <span class="paw-inner-icon">🐾</span>
        </div>
    </div>

    <!-- ВКЛАДКА 1: МИНИ-ИГРЫ (РУЛЕТКА) -->
    <div id="tab-mini-games" class="content-panel">
        <div class="panel-title">🎰 Кошачья Рулетка</div>
        <p style="font-size: 13px; color: #a5a1b8;">Стоимость прокрута: 50 $PURR.</p>
        <button class="roulette-btn" id="spinBtn">Крутить колесо! 🎡</button>
        <div id="rouletteResult" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
    </div>

    <!-- ВКЛАДКА 2: МАГАЗИН АПГРЕЙДОВ -->
    <div id="tab-upgrades" class="content-panel">
        <div class="panel-title">🛒 Магазин Апгрейдов</div>
        <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div style="font-weight: bold; font-size: 14px;">Острые Когти (+1 к тапу)</div>
                <div style="font-size: 12px; color: #8e8a9f;">Цена: <span style="color: #ffd700;">100 $PURR</span></div>
            </div>
            <button id="upgradeBtn" style="background: #9d6fff; border: none; color: white; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">Купить</button>
        </div>
    </div>

    <!-- ВКЛАДКА 3: СТАТУС -->
    <div id="tab-status" class="content-panel">
        <div class="panel-title">👑 Статус Экосистемы</div>
        <p style="font-size: 14px; color: #a5a1b8; line-height: 1.4;">Вы успешно сбросили рабочий стресс! Завершите сессию Тыгыдыка, чтобы отправить итоговый счет обратно коту-психологу.</p>
        <button class="exit-btn" id="exitWebAppBtn">Завершить Тыгыдык и Выйти 🐾</button>
    </div>

    <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
    <div class="navbar">
        <button class="nav-item active">
            <span class="nav-icon">🐾</span>
            <span>Тыгыдык</span>
        </button>
        <button class="nav-item">
            <span class="nav-icon">🎮</span>
            <span>Игры</span>
        </button>
        <button class="nav-item">
            <span class="nav-icon">🛒</span>
            <span>Апгрейды</span>
        </button>
        <button class="nav-item">
        <span class="nav-icon">🏅</span>
        <span>Статус</span>
    </button>

    
    <script>
        // Инициализация Telegram WebApp API
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand(); 

        // Игровые переменные
        let balance = 0;
        let energy = 100;
        const maxEnergy = 100;
        let clickValue = 1;

        // Поиск DOM-элементов
        const balanceEl = document.getElementById('balance');
        const energyBarEl = document.getElementById('energyBar');
        const energyTextEl = document.getElementById('energyText');
        const clickButton = document.getElementById('clickButton');
        const gameContainer = document.getElementById('tab-game');
        
        const navButtons = document.querySelectorAll('.nav-item');
        const spinBtn = document.getElementById('spinBtn');
        const rouletteResult = document.getElementById('rouletteResult');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const exitWebAppBtn = document.getElementById('exitWebAppBtn');

        // Карта соответствия вкладок меню их ID в HTML
        const tabs = {
            0: 'tab-game',
            1: 'tab-mini-games',
            2: 'tab-upgrades',
            3: 'tab-status'
        };

        // Обновление интерфейса
        function updateUI() {
            balanceEl.textContent = balance;
            const energyPercent = (energy / maxEnergy) * 100;
            energyBarEl.style.width = `${energyPercent}%`;
            energyTextEl.textContent = `Ярость кота: ${energy}/${maxEnergy}`;
        }

        // Логика взаимодействия с лапкой (клик/тап)
        function handleInteraction(clientX, clientY) {
            if (energy >= clickValue) {
                balance += clickValue;
                energy -= clickValue;
                updateUI();

                // Создаем и анимируем всплывающую цифру
                const floatingText = document.createElement('div');
                floatingText.className = 'floating-text';
                floatingText.textContent = `+${clickValue}`;
                
                const rect = gameContainer.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                
                floatingText.style.left = `${x}px`;
                floatingText.style.top = `${y}px`;

                gameContainer.appendChild(floatingText);

                setTimeout(() => {
                    floatingText.remove();
                }, 600);
            }
        }

        // Слушатели событий клика на лапку
        clickButton.addEventListener('click', (e) => {
            handleInteraction(e.clientX, e.clientY);
        });

        clickButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                handleInteraction(e.touches[i].clientX, e.touches[i].clientY);
            }
        }, { passive: false });

        // Навигация (переключение вкладок меню)
        function switchTab(activeIndex) {
            navButtons.forEach(btn => btn.classList.remove('active'));
            if (navButtons[activeIndex]) {
                navButtons[activeIndex].classList.add('active');
            }

            // Скрываем все вкладки
            document.getElementById('tab-game').style.display = 'none';
            document.getElementById('tab-mini-games').style.display = 'none';
            document.getElementById('tab-upgrades').style.display = 'none';
            document.getElementById('tab-status').style.display = 'none';

            // Показываем активную
            const targetTabId = tabs[activeIndex];
            const targetTab = document.getElementById(targetTabId);
            if (targetTab) {
                targetTab.style.display = 'flex';
            }
        }

        navButtons.forEach((button, index) => {
            button.addEventListener('click', () => switchTab(index));
            button.addEventListener('touchstart', (e) => {
                e.preventDefault();
                switchTab(index);
            }, { passive: false });
        });

        // Реализация мини-игры «Кошачья Рулетка»
        spinBtn.addEventListener('click', () => {
            if (balance < 50) {
                rouletteResult.style.color = '#ff416c';
                rouletteResult.textContent = 'Недостаточно $PURR! Нужно минимум 50.';
                return;
            }
            balance -= 50;
            const roll = Math.random();
            if (roll > 0.7) {
                const prize = 150;
                balance += prize;
                rouletteResult.style.color = '#ffd700';
                rouletteResult.textContent = `🎰 Джекпот! Вы выиграли +${prize} $PURR!`;
            } else if (roll > 0.3) {
                const prize = 40;
                balance += prize;
                rouletteResult.style.color = '#ffffff';
                rouletteResult.textContent = `🐱 Обычный прокрут. Вернулось +${prize} $PURR.`;
            } else {
                rouletteResult.style.color = '#ff416c';
                rouletteResult.textContent = '😿 Увы, мимо! Вы ничего не выиграли.';
            }
            updateUI();
        });

        // Реализация Магазина Апгрейдов
        upgradeBtn.addEventListener('click', () => {
            if (balance < 100) {
                alert('Не хватает $PURR для покупки когтей!');
                return;
            }
            balance -= 100;
            clickValue += 1;
            updateUI();
            alert('Когти успешно улучшены! Теперь один тап дает больше $PURR!');
        });

        // Закрытие WebApp и отправка данных в бот LeadTeh
        exitWebAppBtn.addEventListener('click', () => {
            if (tg) {
                const resultData = JSON.stringify({ score: balance });
                tg.sendData(resultData); 
                tg.close(); 
            } else {
                alert(`Режим тестирования: отправлено ${balance} $PURR в бот.`);
            }
        });

        // Регенерация шкалы ярости (энергии) раз в секунду
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 1);
                updateUI();
            }
        }, 1000);

        // Первоначальный запуск системы
        switchTab(0);
        updateUI();
    </script>
</body>
</html>
